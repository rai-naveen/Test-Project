<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131c">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #222b46 0%, #10131c 58%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 22px;
      border: 1px solid #ffffff14;
      border-radius: 28px;
      background: #191d29;
      box-shadow: 0 24px 70px #0008;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      color: #aab1c5;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .display {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 16px 4px 22px;
      text-align: right;
    }

    .previous {
      width: 100%;
      min-height: 24px;
      overflow: hidden;
      color: #8d95aa;
      font-size: 1rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current {
      width: 100%;
      overflow: hidden;
      font-size: clamp(2.5rem, 12vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 300;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 64px;
      border: 0;
      border-radius: 19px;
      background: #252a39;
      color: #f5f7ff;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      transition: transform 120ms ease, background 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #31384b; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #9a8cff; outline-offset: 3px; }
    button.utility { color: #b7adff; background: #29263c; }
    button.operator { color: #c4baff; background: #302c49; }
    button.equals { color: white; background: #7662e8; }
    button.equals:hover { background: #8876f3; }
    button.zero { grid-column: span 2; }

    @media (max-width: 380px) {
      .calculator { padding: 16px; border-radius: 24px; }
      .keys { gap: 8px; }
      button { min-height: 58px; border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="topline"><span>Calculator</span><span aria-hidden="true">⌘</span></div>
    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
      <div class="previous" id="previous"></div>
      <output class="current" id="current">0</output>
    </section>
    <div class="keys" aria-label="Calculator buttons">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const currentDisplay = document.querySelector("#current");
    const previousDisplay = document.querySelector("#previous");

    let currentValue = "0";
    let storedValue = null;
    let selectedOperator = null;
    let startNewNumber = false;

    function formatResult(number) {
      if (!Number.isFinite(number)) return "Error";
      // Avoid displaying floating-point artifacts such as 0.1 + 0.2 = 0.30000000000000004.
      const rounded = Number.parseFloat(number.toPrecision(12));
      return String(rounded);
    }

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = selectedOperator && storedValue !== null
        ? `${storedValue} ${selectedOperator}`
        : "";
    }

    function enterDigit(digit) {
      if (currentValue === "Error" || startNewNumber) {
        currentValue = digit;
        startNewNumber = false;
      } else if (currentValue === "0") {
        currentValue = digit;
      } else if (currentValue.replace("-", "").length < 14) {
        currentValue += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (currentValue === "Error" || startNewNumber) {
        currentValue = "0.";
        startNewNumber = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }
      updateDisplay();
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "−": return left - right;
        case "×": return left * right;
        case "÷": return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function chooseOperator(operator) {
      if (currentValue === "Error") return;
      const input = Number(currentValue);
      if (selectedOperator && storedValue !== null && !startNewNumber) {
        const result = calculate(storedValue, input, selectedOperator);
        currentValue = formatResult(result);
        storedValue = result;
      } else {
        storedValue = input;
      }
      selectedOperator = operator;
      startNewNumber = true;
      updateDisplay();
    }

    function showResult() {
      if (selectedOperator === null || storedValue === null || currentValue === "Error") return;
      const left = storedValue;
      const right = Number(currentValue);
      const result = formatResult(calculate(left, right, selectedOperator));
      previousDisplay.textContent = `${left} ${selectedOperator} ${right} =`;
      currentValue = result;
      storedValue = null;
      selectedOperator = null;
      startNewNumber = true;
      currentDisplay.textContent = currentValue;
    }

    function clear() {
      currentValue = "0";
      storedValue = null;
      selectedOperator = null;
      startNewNumber = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === "clear") return clear();
      if (action === "decimal") return enterDecimal();
      if (action === "equals") return showResult();
      if (currentValue === "Error") return;
      if (action === "sign") {
        if (Number(currentValue) !== 0) currentValue = String(Number(currentValue) * -1);
      } else if (action === "percent") {
        currentValue = formatResult(Number(currentValue) / 100);
      }
      updateDisplay();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (event.key === "+") chooseOperator("+");
      else if (event.key === "-") chooseOperator("−");
      else if (event.key === "*") chooseOperator("×");
      else if (event.key === "/") { event.preventDefault(); chooseOperator("÷"); }
      else if (event.key === "Enter" || event.key === "=") showResult();
      else if (event.key === "Escape") clear();
      else if (event.key === "Backspace") {
        if (!startNewNumber && currentValue !== "Error") {
          currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : "0";
          if (currentValue === "-") currentValue = "0";
          updateDisplay();
        }
      }
    });

    updateDisplay();
  </script>
</body>
</html>
